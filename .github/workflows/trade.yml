name: trade

on:
  schedule:
    - cron: "7 * * * *"        # 7 min past every hour, UTC
  workflow_dispatch:            # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false     # never let two runs touch state.json at once

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet ccxt requests

      - name: Run one hour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Save results
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "bar $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push
