name: trade

on:
  schedule:
    - cron: "7 * * * *"        # 7 min past every hour, UTC
  workflow_dispatch:            # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false     # queue runs, never overlap

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet ccxt requests

      - name: Check key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "length: ${#GEMINI_API_KEY}"
          case "$GEMINI_API_KEY" in
            AIza*) echo "prefix: ok" ;;
            "")    echo "prefix: EMPTY SECRET" ;;
            *)     echo "prefix: wrong, does not start with AIza" ;;
          esac

      - name: Run one hour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      # state.json and docs/data.json are GENERATED, never hand-edited.
      # So on collision we always keep ours - no merge, no rebase, no conflict.
      # Everything else (bot.py, index.html) is taken fresh from the remote,
      # so an edit made in the browser mid-run is never overwritten.
      - name: Save results
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/out
          cp state.json /tmp/out/state.json
          cp docs/data.json /tmp/out/data.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/out/state.json state.json
            mkdir -p docs && cp /tmp/out/data.json docs/data.json
            git add state.json docs/data.json
            if git diff --staged --quiet; then
              echo "nothing changed"; exit 0
            fi
            git commit -m "bar $(date -u +%Y-%m-%dT%H:%M)"
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push race, retrying in 5s"
            sleep 5
          done
          echo "could not push after 5 attempts"
          exit 1
